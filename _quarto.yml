project:
  type: book
  output-dir: docs
  resources:
    - /reports/gpfg-data-audit.md
    - /images/Rlogo.png
    - /images/douban.png
    - /images/grp-summarize-01.mp4
    - /images/grp-summarize-02.mp4
    - /images/grp-summarize-03.mp4
    - /images/install-r-rstudio.png
    - /images/left-join.gif
    - /images/rmarkdown.png
    - /images/rstudio-ide.png
    - /images/tidyr-pivoting.gif
    - /cheatsheets/rmarkdown.pdf
    - /cheatsheets/rstudio-ide.pdf

book:
  title: "Data Journalism with R"
  author: "Bin Chen"
  date: last-modified
  page-footer: "Copyright © 2026 Bin Chen"
  search: true
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - install.qmd
        - r-basics.qmd
        - debug.qmd
    - part: "A Reproducible Data Workflow"
      chapters:
        - data-import.qmd
        - data-wrangling.qmd
        - transform-merge.qmd
        - analysis-gpfg.qmd
        - analysis-gpfg-trends.qmd
    - part: "Visual Evidence and Storytelling"
      chapters:
        - visual-01.qmd
        - visual-02.qmd
        - map-gpfg.qmd
        - norway-invest.qmd
    - part: "Transfer Case Studies"
      chapters:
        - employment.qmd
        - olympics.qmd
        - debate.qmd
        - hot100.qmd
        - additional-practice.qmd
  appendices:
    - quarto.qmd
    - final_project_notes.qmd
    - links.qmd
    - references.qmd

bibliography: references.bib

execute:
  warning: false
  message: false

format:
  html:
    theme: cosmo
    df-print: paged
    code-overflow: wrap
    code-copy: true
    number-depth: 2
    toc-depth: 3

editor: source
